<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#101720; --panel:#161F2A; --raised:#1D2733; --line:#2B3745; --line-soft:#232E3B;
  --tx:#E6ECF2; --tx-dim:#93A5B7; --tx-faint:#63758A;
  --P:#E9A23B; --D:#63BE4F; --C:#37A8DE; --A:#D8483C;
  --warn:#E9A23B; --bad:#D8483C; --good:#63BE4F; --info:#37A8DE;
  --rail:264px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:'Barlow',system-ui,sans-serif; font-size:14px; line-height:1.45;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.cond{font-family:'Barlow Condensed','Barlow',sans-serif;letter-spacing:.01em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:5px 7px;font-variant-numeric:tabular-nums}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--info);outline-offset:1px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;height:100vh;overflow:hidden}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.main{overflow-y:auto;padding:0 26px 60px}

.brand{padding:16px 18px 13px;border-bottom:1px solid var(--line)}
.brand h1{font-size:21px;font-weight:700;line-height:1.05;text-transform:uppercase}
.brand .sub{font-size:12px;color:var(--tx-faint);margin-top:2px}
.season{display:flex;align-items:center;gap:8px;margin-top:6px}
.season span{font-family:'Barlow Condensed';font-size:17px;font-weight:600;min-width:76px;text-align:center}
.season button{width:23px;height:23px;border:1px solid var(--line);border-radius:4px;color:var(--tx-dim);
  font-size:15px;line-height:1;display:grid;place-items:center}
.season button:hover:not(:disabled){border-color:var(--info);color:var(--tx)}
.season button:disabled{opacity:.3;cursor:default}
.rank{font-family:'Barlow Condensed';font-size:19px;font-weight:700;width:30px}
.medal{color:var(--warn)}
tr.me td{background:#17222E}

.railscroll{overflow-y:auto;flex:1;padding:8px 0}
.railhead{font-size:11px;color:var(--tx-faint);padding:10px 18px 5px;font-weight:600}
.tbtn{display:block;width:100%;text-align:left;padding:7px 18px;border-left:3px solid transparent;position:relative}
.tbtn:hover{background:var(--raised)}
.tbtn.on{background:var(--raised);border-left-color:var(--info)}
.tbtn .nm{font-family:'Barlow Condensed';font-size:16px;font-weight:600;text-transform:uppercase;line-height:1.2}
.tbtn .mt{font-size:11.5px;color:var(--tx-faint);display:flex;gap:9px;margin-top:1px}
.tbtn .dot{position:absolute;right:14px;top:12px;width:7px;height:7px;border-radius:50%}
.railfoot{border-top:1px solid var(--line);padding:9px 14px;display:flex;gap:7px;flex-wrap:wrap}
.railfoot button{font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:4px;color:var(--tx-dim)}
.railfoot button:hover{border-color:var(--info);color:var(--tx)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;position:sticky;top:0;background:var(--bg);padding:14px 0 0;z-index:20;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.railscroll::-webkit-scrollbar{height:0}
.tab{padding:7px 15px 9px;font-size:13px;font-weight:600;color:var(--tx-faint);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--tx-dim)}
.tab.on{color:var(--tx);border-bottom-color:var(--info)}

/* ---------- team header ---------- */
.thead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:22px 0 16px;flex-wrap:wrap}
.thead h2{font-size:34px;font-weight:700;text-transform:uppercase;line-height:1}
.thead .pos{font-size:13px;color:var(--tx-faint);margin-top:3px}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stat .v{font-family:'Barlow Condensed';font-size:26px;font-weight:600;line-height:1}
.stat .l{font-size:11.5px;color:var(--tx-faint);margin-top:1px}

/* ---------- roster ---------- */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
@media(max-width:1080px){.cols{grid-template-columns:1fr}}
.block{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel);margin-bottom:16px}
.bhead{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--raised);border-bottom:1px solid var(--line)}
.bhead .t{font-family:'Barlow Condensed';font-size:15px;font-weight:600;text-transform:uppercase}
.bhead .c{font-size:12px;color:var(--tx-faint)}
.bhead.over .c{color:var(--bad);font-weight:600}

.row{display:grid;grid-template-columns:20px 1fr 74px 62px 30px;gap:9px;align-items:center;
     padding:5px 12px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.row:last-child{border-bottom:none}
.row:hover{background:var(--raised)}
.row .rl{font-family:'Barlow Condensed';font-weight:700;font-size:14px;text-align:center}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm b{font-weight:500}
.row .nm span{color:var(--tx-faint);font-size:12px;margin-left:6px}
.row .pz{text-align:right;font-size:13px;color:var(--tx-dim)}
.row .fl{text-align:center;font-size:12px}
.row.empty{color:var(--tx-faint);font-style:italic;cursor:default}
.row.empty:hover{background:none}
.row.eccedenza{background:#2A1614;box-shadow:inset 3px 0 0 var(--bad)}
.row.eccedenza:hover{background:#331B18}
.row.empty.manca{grid-template-columns:20px 1fr;background:#241D10;box-shadow:inset 3px 0 0 var(--warn);color:#E0B978}
.row.empty.manca .rl{color:var(--warn);font-weight:700}
.notaflag{padding:6px 12px;font-size:12px;border-top:1px solid var(--line-soft)}
.notaflag.over{color:#E48278;background:#20120F}
.notaflag.short{color:#D9B172;background:#1E1810}
.bhead.short .c{color:var(--warn);font-weight:600}

/* contract clock */
.clock{display:flex;gap:2px;justify-content:flex-end}
.seg{width:11px;height:9px;border-radius:1.5px;background:var(--line)}
.seg.on{background:var(--good)}
.seg.last{background:var(--warn)}
.seg.dead{background:var(--bad)}

.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:3px;vertical-align:1px}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;color:var(--tx-faint);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid var(--line-soft);font-size:13.5px}
tr:last-child td{border-bottom:none}
.num{text-align:right}

/* ---------- panels / forms ---------- */
.card{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:16px 18px;margin-bottom:16px}
.card h3{font-size:17px;font-weight:600;text-transform:uppercase;margin-bottom:3px}
.card .hint{font-size:12.5px;color:var(--tx-faint);margin-bottom:13px;max-width:66ch}
.grid{display:grid;gap:11px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:820px){.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
.f label{display:block;font-size:11.5px;color:var(--tx-faint);margin-bottom:3px}
.f input,.f select{width:100%}
.btn{border:1px solid var(--line);border-radius:4px;padding:7px 13px;font-size:13px;font-weight:500;color:var(--tx-dim)}
.btn:hover{border-color:var(--info);color:var(--tx)}
.btn.pri{background:var(--info);border-color:var(--info);color:#08131C;font-weight:600}
.btn.pri:hover{filter:brightness(1.1);color:#08131C}
.btn.dgr{border-color:#5A2C29;color:#E48278}
.btn.dgr:hover{background:#2A1614;border-color:var(--bad);color:#FFB3A9}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* ---------- alerts ---------- */
.alert{display:flex;gap:11px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--line-soft)}
.alert:last-child{border-bottom:none}
.alert .ic{font-size:14px;line-height:1.3}
.alert .tx b{font-weight:600}
.alert .tx div{font-size:12.5px;color:var(--tx-faint)}
.ok-empty{padding:15px 12px;color:var(--tx-faint);font-size:13px}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,12,18,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(480px,100%);max-height:88vh;overflow-y:auto}
.mhead{padding:15px 20px 12px;border-bottom:1px solid var(--line)}
.mhead h3{font-size:21px;font-weight:600}
.mhead .s{font-size:12.5px;color:var(--tx-faint)}
.mbody{padding:16px 20px}
.mfoot{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--raised);
  border:1px solid var(--line);border-radius:5px;padding:9px 16px;font-size:13px;z-index:200}
@media(prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}}
@keyframes up{from{opacity:0;transform:translate(-50%,7px)}}
.hidden{display:none!important}

/* ---------- scambi ---------- */
.trade{display:grid;grid-template-columns:1fr 46px 1fr;gap:14px;align-items:start}
@media(max-width:900px){.trade{grid-template-columns:1fr}.tradearrow{display:none}}
.tradearrow{align-self:center;text-align:center;color:var(--tx-faint);font-size:20px;padding-top:60px}
.side{border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden}
.side header{padding:10px 12px;background:var(--raised);border-bottom:1px solid var(--line)}
.side header select{width:100%;font-family:'Barlow Condensed';font-size:16px;font-weight:600;text-transform:uppercase}
.side .meta{font-size:11.5px;color:var(--tx-faint);margin-top:5px;display:flex;gap:11px;flex-wrap:wrap}
.pickrow{display:flex;gap:6px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--line-soft)}
.chip{border:1px solid var(--line);border-radius:12px;padding:2px 9px;font-size:11.5px;color:var(--tx-dim)}
.chip.on{background:var(--info);border-color:var(--info);color:#08131C;font-weight:600}
.chip:hover{border-color:var(--info)}
.pk{max-height:210px;overflow-y:auto}
.selrow{display:grid;grid-template-columns:18px 20px 1fr 54px;gap:8px;align-items:center;
  padding:4px 12px;border-bottom:1px solid var(--line-soft);cursor:pointer;font-size:13px}
.selrow:hover{background:var(--raised)}
.selrow.on{background:#17303F}
.balance{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:13px 16px;margin-top:16px}
.bal{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.bal span b{font-family:'Barlow Condensed';font-size:17px}
.err{color:#F0968C;font-size:13px;margin-top:9px}
.okmsg{color:#8FD97C;font-size:13px;margin-top:9px}

/* ---------- listone ---------- */
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.toolbar input[type=search]{min-width:210px}
.owner{font-size:11.5px;color:var(--tx-faint)}
.free{color:var(--good);font-weight:600;font-size:11.5px}
.dropzone{border:1px dashed var(--line);border-radius:6px;padding:26px 20px;text-align:center;color:var(--tx-faint);font-size:13.5px}
.dropzone.hot{border-color:var(--info);color:var(--tx-dim)}

/* ---------- legenda fasce ---------- */
.legenda{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:9px 12px;
  border:1px solid var(--line);border-radius:6px;background:var(--panel);margin-bottom:14px;font-size:12.5px}
.legenda .lf{display:flex;align-items:center;gap:6px;color:var(--tx-dim)}
.legenda .lf i{font-style:normal;color:var(--tx-faint)}
.legenda .lf.note{color:var(--tx-faint);margin-left:auto}
.fa{font-size:11px;font-weight:700;padding:2px 6px;border-radius:3px}
.fa.U23{background:#243542;color:#9CC4DA}
.fa.U22{background:#2A2036;color:#C89BE8}
.fa.U21{background:#1E3324;color:#8FD97C}
.fa.U20{background:#1E3324;color:#8FD97C}

/* ---------- lavagna draft ---------- */
.giro{border:1px solid var(--line);border-radius:6px;background:var(--panel);margin-bottom:12px;overflow:hidden}
.giro>header{padding:7px 12px;background:var(--raised);border-bottom:1px solid var(--line);
  font-family:'Barlow Condensed';font-size:14px;font-weight:600;text-transform:uppercase;
  display:flex;justify-content:space-between}
.pcell{display:grid;grid-template-columns:34px 1fr 1fr auto;gap:10px;align-items:center;
  padding:5px 12px;border-bottom:1px solid var(--line-soft);font-size:13px}
.pcell:last-child{border-bottom:none}
.pcell .n{font-family:'Barlow Condensed';font-weight:700;font-size:15px;color:var(--tx-faint)}
.pcell .via{color:var(--tx-faint);font-size:12px}
.pcell.presa{background:#16232E}
.pcell button{font-size:12px;padding:3px 9px;border:1px solid var(--line);border-radius:4px;color:var(--tx-dim)}
.pcell button:hover{border-color:var(--info);color:var(--tx)}
.pkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pkcard{border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden}
.pkcard header{padding:8px 11px;background:var(--raised);border-bottom:1px solid var(--line);
  font-family:'Barlow Condensed';font-size:15px;font-weight:600;text-transform:uppercase}
.pkcard .anno{padding:7px 11px;border-bottom:1px solid var(--line-soft)}
.pkcard .anno:last-child{border-bottom:none}
.pkcard .anno .y{font-size:11px;color:var(--tx-faint);margin-bottom:4px}
.pkcard .anno .cs{display:flex;gap:5px;flex-wrap:wrap}
.pkc{font-size:11.5px;border:1px solid var(--line);border-radius:11px;padding:1px 8px;color:var(--tx-dim)}
.pkc.acq{border-color:#2F5A3A;background:#16261C;color:#8FD97C}
.pkc.usata{opacity:.45;text-decoration:line-through}

/* ---------- accesso ---------- */
.gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:20px;z-index:300}
.gatebox{width:min(400px,100%);border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:26px 28px}
.gatebox h1{font-size:27px;font-weight:700;text-transform:uppercase;line-height:1}
.gatebox p{font-size:13px;color:var(--tx-faint);margin:7px 0 18px}
.gatebox input{width:100%;font-size:15px;padding:9px 11px;letter-spacing:.02em}
.gatebox .btn{width:100%;margin-top:11px;padding:9px}
.gatebox .msg{font-size:13px;margin-top:11px;min-height:18px}

/* ---------- stato collegamento ---------- */
.sync{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--tx-faint);padding:7px 18px;border-top:1px solid var(--line)}
.sync .led{width:7px;height:7px;border-radius:50%;background:var(--tx-faint);flex:none}
.sync .led.on{background:var(--good)}
.sync .led.off{background:var(--bad)}
/* ---------- ricerca nel listone ---------- */
.cerca{margin-bottom:15px}
.cerca label{display:block;font-size:11.5px;color:var(--tx-faint);margin-bottom:3px}
.cerca input{width:100%}
.ris{margin-top:5px}
.ris:not(:empty){border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--bg)}
.rit{display:grid;grid-template-columns:18px 1fr 38px auto;gap:9px;align-items:center;
  padding:6px 10px;border-bottom:1px solid var(--line-soft);cursor:pointer;font-size:13px}
.rit:last-child{border-bottom:none}
.rit:hover{background:var(--raised)}
.rit .rl{font-family:'Barlow Condensed';font-weight:700;text-align:center}
.rit .rn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rit .rc{color:var(--tx-faint);font-size:12px;margin-left:6px}
.rit .rq{text-align:right;color:var(--tx-dim)}
.rit .ro{font-size:11.5px;color:var(--tx-faint);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rit .ro b{color:var(--good);font-weight:600}
.rvoid{padding:9px 11px;font-size:12.5px;color:var(--tx-faint)}

.banner{border:1px solid var(--line);border-left:3px solid var(--info);border-radius:0 6px 6px 0;
  background:var(--panel);padding:10px 14px;margin:14px 0;font-size:13px;color:var(--tx-dim)}

/* ---------- telefono ---------- */
@media(max-width:760px){
  .app{grid-template-columns:1fr;height:auto;overflow:visible}
  .rail{border-right:none;border-bottom:1px solid var(--line)}
  .brand{padding:10px 14px 8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand h1{font-size:19px}
  .brand .sub{display:none}
  .season{margin-top:0}
  .railhead{display:none}
  /* le squadre diventano una fila scorrevole invece di una colonna */
  .railscroll{display:flex;flex:none;gap:6px;padding:7px 12px;overflow-x:auto;overflow-y:hidden}
  .tbtn{width:auto;flex:none;min-width:138px;border:1px solid var(--line);border-radius:6px;padding:6px 11px}
  .tbtn.on{border-color:var(--info)}
  .tbtn .nm{font-size:14px}
  .tbtn .mt{font-size:10.5px;gap:7px}
  .tbtn .dot{top:8px;right:8px}
  .sync{padding:6px 14px}
  .railfoot{padding:7px 11px;gap:6px}
  .railfoot button{font-size:11.5px;padding:4px 9px}

  .main{overflow:visible;padding:0 14px 50px}
  .tabs{overflow-x:auto;white-space:nowrap;padding-top:9px}
  .tab{flex:none;padding:6px 12px 8px;font-size:12.5px}

  .thead{padding:16px 0 12px;gap:14px}
  .thead h2{font-size:26px}
  .stats{gap:18px}
  .stat .v{font-size:22px}

  /* le tabelle larghe scorrono in orizzontale dentro la propria scheda */
  .card:has(table){overflow-x:auto!important}
  .card table,.block table{min-width:520px}
  .card{padding:14px}

  .row{grid-template-columns:17px 1fr 54px 50px 20px;gap:7px;padding:6px 10px}
  .row .nm span{display:none}
  .pcell{grid-template-columns:30px 1fr auto;gap:9px}
  .pcell .via{font-size:11px}
  .pkgrid{grid-template-columns:1fr}
  .legenda{gap:10px;font-size:12px}
  .legenda .lf.note{margin-left:0;width:100%}
  .toolbar input[type=search]{min-width:0;flex:1}
  .gatebox{padding:22px 20px}
}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <h1 id="leagueName">Lega</h1>
      <div class="season">
        <button id="btnPrev" title="Stagione precedente">‹</button>
        <span id="seasonLbl"></span>
        <button id="btnNext" title="Stagione successiva">›</button>
      </div>
      <div class="sub" id="teamCount"></div>
    </div>
    <div class="railscroll">
      <div class="railhead">Squadre</div>
      <div id="teamList"></div>
    </div>
    <div class="sync"><span class="led" id="led"></span><span id="syncTx">non collegato</span></div>
    <div class="railfoot">
      <button id="btnExport">Esporta dati</button>
      <button id="btnImport">Importa</button>
      <button id="btnReset">Ripristina</button>
      <input type="file" id="fileIn" accept="application/json" class="hidden">
    </div>
  </aside>

  <main class="main">
    <nav class="tabs">
      <button class="tab on" data-tab="rosa">Rosa</button>
      <button class="tab" data-tab="scambi">Scambi</button>
      <button class="tab hidden" id="tabRich" data-tab="richieste">Richieste</button>
      <button class="tab" data-tab="riconferme">Riconferme</button>
      <button class="tab" data-tab="draft">Draft</button>
      <button class="tab" data-tab="picks">Picks</button>
      <button class="tab" data-tab="classifica">Classifica</button>
      <button class="tab" data-tab="storico">Storico</button>
      <button class="tab" data-tab="listone">Listone</button>
      <button class="tab" data-tab="svincolati">Svincolati</button>
      <button class="tab" data-tab="controlli">Controlli</button>
      <button class="tab" data-tab="regole">Regolamento</button>
    </nav>
    <section id="view"></section>

async function entra(cod){
  apriDb();
  if(!db) throw new Error("Libreria di collegamento non caricata");
  const { data, error } = await db.rpc("chi_sono", { p_codice: cod });
  if(error) throw error;
  if(!data || !data.length) throw new Error("Codice non riconosciuto");
  codice = cod; io = data[0];
  try{ await window.storage.set(CODICE_KEY, cod); }catch(e){}
  return io;
}

async function scaricaStato(){
  const { data, error } = await db.from("stato").select("dati,versione").eq("id",1).maybeSingle();

  if(!data) return null;
  versione = data.versione;
  return migra(data.dati);
}

  const { data, error } = await db.rpc("salva_stato",
    { p_codice: codice, p_dati: S, p_versione: versione });
  if(error){

  versione = data;

}

function ascolta(){
  if(!db) return;
  db.channel("lega")
    .on("postgres_changes", { event:"*", schema:"public", table:"stato" }, async () => {
      if(sonoAdmin()) return;                 // l'admin è la fonte, non si riallinea a sé stesso
      const nuovo = await scaricaStato();
      if(nuovo){ S = nuovo; render(); toast("Dati aggiornati dall'amministratore"); }
    })
    .on("postgres_changes", { event:"*", schema:"public", table:"azioni" }, async () => {
      await caricaAzioni();
      if(sonoAdmin()) render();
    })
    .subscribe();
}

    const r = await window.storage.get(KEY);
    if(r && r.value) return migra(JSON.parse(r.value));
  }catch(e){ /* prima apertura: nessuna copia locale */ }
  return freshState();
}

/* ================= stato ================= */
function freshState(){
  const d = JSON.parse(JSON.stringify(DEFAULT_DATA));
  d.regole = JSON.parse(JSON.stringify(REGOLE_DEFAULT));
  d.annoStagione = 2025;                       // stagione 2025/26
  d.listone = [];                              // si popola importando le quotazioni ufficiali
  d.listoneInfo = null;
  d.squadre.forEach((s,i) => {
    s.posizione = s.posizione ?? null;
    s.rosa.forEach(p => { if(!p.id) p.id = uid(); });
  });
  d.picks = generaPicks(d);
  d.scambi = [];
  d.dataVersion = DATA_VERSION;
  return d;
}

// ogni squadra parte proprietaria delle proprie picks, per le annate a venire
function generaPicks(d){
  const out = [];
  for(let a = 1; a <= d.regole.stagioniPick; a++){
    const anno = d.annoStagione + a;
    d.squadre.forEach(s => {
      for(let g = 1; g <= d.regole.giriPick; g++)
        out.push({ id:uid(), anno, giro:g, origine:s.id, possessore:s.id });
    });
  }
  return out;
}
function uid(){ return Math.random().toString(36).slice(2,10); }

// i salvataggi della prima versione non conoscono listone, picks e scambi
function migra(d){
  const rd = REGOLE_DEFAULT;
  d.regole = Object.assign({}, rd, d.regole || {});
  d.listone = d.listone || [];
  d.listoneInfo = d.listoneInfo ?? null;
  d.scambi = d.scambi || [];
  if(!d.picks || !d.picks.length) d.picks = generaPicks(d);
  d.archivio = d.archivio || [];
  return d;
}

/* ================= calcoli ================= */
const team = () => S.squadre[sel];

function anniResidui(p){
  if(!p.scadenza) return null;
  return +p.scadenza.slice(0,4) - S.annoStagione;
}
function durataMax(p){
  if(p.reparto === "primavera" && p.fascia){
    const f = p.fascia === "U21/U20" ? "U21" : p.fascia;
    return S.regole.durataPrimavera[f] ?? S.regole.durataPrima;
  }
  return S.regole.durataPrima;
}
function fuoriSerieA(p){ return !p.club; }

// un giocatore è riconfermabile se resta almeno una stagione oltre quella corrente
function riconfermabile(p){
  const a = anniResidui(p);
  return p.reparto === "prima" && a !== null && a >= 2 && !fuoriSerieA(p);
}
// indice per nome del listone, ricostruito solo quando il listone cambia
let _idx = null, _idxSrc = null;
function indiceListone(){
  if(_idx && _idxSrc === S.listone) return _idx;
  _idxSrc = S.listone;
  _idx = (S.listone || []).map(l => ({ k: norm(l.nome), l }));
  return _idx;
}
function voceListone(p){
  const x = norm(p.nome);
  if(!x) return null;
  const idx = indiceListone();
  return idx.find(e => e.k === x)?.l
      || idx.find(e => e.k.startsWith(x + " ") || x.startsWith(e.k + " "))?.l
      || null;
}
// la quotazione ufficiale vale come riferimento, salvo un valore forzato a mano
function quotazioneUfficiale(p){ const l = voceListone(p); return l ? l.qa : null; }
function quotazione(p){ return p.quotazione ?? quotazioneUfficiale(p); }

function costoRiconferma(p){
  return Math.max(p.prezzo || 0, quotazione(p) ?? 0);
}
function nRiconferme(sq){
  const r = S.regole.riconferme;
  return (sq.posizione && r[sq.posizione] != null) ? r[sq.posizione] : r.default;
}
function reparto(sq, r){ return sq.rosa.filter(p => p.reparto === "prima" && p.ruolo === r); }
function primavera(sq){ return sq.rosa.filter(p => p.reparto === "primavera"); }
function fuoriRosa(sq){ return sq.rosa.filter(p => p.reparto === "fuori_rosa"); }
function occupatiVivaio(sq){ return primavera(sq).length + fuoriRosa(sq).length; }
function contaFascia(sq, f){
  return primavera(sq).filter(p => (f === "U21/U20" ? (p.fascia === "U21" || p.fascia === "U20" || p.fascia === "U21/U20") : p.fascia === f)).length;
}
function speso(sq){ return sq.rosa.filter(p => p.reparto === "prima").reduce((n,p) => n + (p.prezzo||0), 0); }

/* ---- listone: normalizzazione e abbinamento ---- */
function norm(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]/g," ").replace(/\s+/g," ").trim();
}
// il listone scrive "Milinkovic-Savic V.", il foglio scrive "Milinkovic-savic":
// confronto normalizzato, poi ripiego sul prefisso più lungo
function stessoGiocatore(a,b){
  const x = norm(a), y = norm(b);
  if(!x || !y) return false;
  if(x === y) return true;
  return x.startsWith(y + " ") || y.startsWith(x + " ");
}
function tuttiTesserati(){
  const out = [];
  S.squadre.forEach(s => s.rosa.forEach(p => out.push({ p, s })));
  return out;
}
function proprietario(nomeListone){
  return tuttiTesserati().find(t => stessoGiocatore(nomeListone, t.p.nome));
}
function svincolati(){
  const t = tuttiTesserati();
  return S.listone.filter(l => !t.some(x => stessoGiocatore(l.nome, x.p.nome)));
}

/* ---- picks ---- */
function picksDi(idSquadra){
  return S.picks.filter(p => p.possessore === idSquadra)
    .sort((a,b) => a.anno - b.anno || a.giro - b.giro);
}
function nomeSquadra(id){ return (S.squadre.find(s => s.id === id) || {}).nome || "?"; }
function etichettaPick(pk){
  const base = `${pk.giro}º ${pk.anno}`;
  return pk.origine === pk.possessore ? base : `${base} (via ${nomeSquadra(pk.origine)})`;
}
// anno del prossimo draft: si tiene prima dell'asta della stagione entrante
function annoDraft(){ return S.annoStagione + 1; }
function pickDi(anno, giro, origineId){
  return S.picks.find(p => p.anno === anno && p.giro === giro && p.origine === origineId);
}
// a quale annata di nascita corrisponde ogni fascia, per la stagione indicata
function fasceAnno(anno){
  return [["U23", anno-23, "23 anni"], ["U22", anno-22, "22 anni"],
          ["U21", anno-21, "21 anni"], ["U20", anno-20, "20 anni o meno"]];
}
function legendaFasce(anno, extra){
  return `<div class="legenda">
    ${fasceAnno(anno).map(([f,y,e]) =>
      `<span class="lf"><b class="fa ${f}">${f}</b> nati nel ${y}${f==="U20"?" o dopo":""} <i>${e}</i></span>`).join("")}
    <span class="lf note">stagione ${anno}/${String(anno+1).slice(2)}${extra ? " · " + extra : ""}</span></div>`;
}

function problemi(sq){
  const out = [];
  RUOLI.forEach(r => {
    const n = reparto(sq,r).length, lim = S.regole.rosa[r];
    if(n !== lim) out.push({ lv: n > lim ? "bad":"warn", t:`${RUOLO_NOME[r]}: ${n} su ${lim}`, d: n>lim ? "Reparto oltre il limite" : "Reparto incompleto" });
  });
  const occ = occupatiVivaio(sq);
  if(occ > S.regole.slotPrimavera) out.push({ lv:"bad", t:`Vivaio: ${occ} su ${S.regole.slotPrimavera} slot`, d:"Servono svincoli o promozioni per rientrare" });
  Object.entries(S.regole.slotFascia).forEach(([f,lim]) => {
    const n = contaFascia(sq,f);
    if(n > lim) out.push({ lv:"bad", t:`Fascia ${f}: ${n} su ${lim}`, d:"Limite di fascia superato" });
  });
  sq.rosa.forEach(p => {
    const a = anniResidui(p);
    if(a === null) out.push({ lv:"warn", t:p.nome, d:"Scadenza contratto non impostata" });
    else if(a <= 0) out.push({ lv:"bad", t:p.nome, d:`Contratto scaduto il 1/09/${p.scadenza.slice(0,4)}` });
    else if(a === 1 && p.reparto === "prima") out.push({ lv:"info", t:p.nome, d:"Ultima stagione, non riconfermabile a settembre" });
    if(fuoriSerieA(p)) out.push({ lv:"warn", t:p.nome, d:"Fuori dalla Serie A, libera subito lo slot" });
  });
  return out;
}

function renderRail(){
  document.getElementById("teamList").innerHTML = S.squadre.map((s,i) => {
    const pb = problemi(s);
    const bad = pb.some(p => p.lv === "bad");
    const warn = pb.some(p => p.lv === "warn");
    const col = bad ? "var(--bad)" : warn ? "var(--warn)" : "transparent";
    return `<button class="tbtn ${i===sel?"on":""}" data-team="${i}">
      <div class="nm">${esc(s.nome)}</div>
      <div class="mt"><span>${s.posizione ? s.posizione+"º" : "—"}</span><span>${s.crediti_residui} cr</span><span>${occupatiVivaio(s)}/${S.regole.slotPrimavera} vivaio</span></div>
      <span class="dot" style="background:${col}"></span></button>`;
  }).join("");
}

function clock(p){
  const a = anniResidui(p), max = Math.max(durataMax(p), a || 0);
  if(a === null) return `<span style="color:var(--tx-faint);font-size:12px">—</span>`;
  let h = "";
  for(let i=0;i<max;i++){
    let c = "seg";
    if(i < a) c += (a === 1 ? " last" : " on");
    h += `<span class="${c}"></span>`;
  }
  if(a <= 0) h = `<span class="seg dead"></span>`.repeat(Math.max(max,1));
  return `<span class="clock" title="${a<=0?"Scaduto":a+" stagioni residue"}">${h}</span>`;
}

function rowPlayer(p, stato){
  const a = anniResidui(p);
  let flag = "";
  if(fuoriSerieA(p)) flag = `<span title="Fuori dalla Serie A" style="color:var(--bad)">✕</span>`;
  else if(a !== null && a <= 0) flag = `<span title="Contratto scaduto" style="color:var(--bad)">▲</span>`;
  else if(a === 1) flag = `<span title="Ultimo anno di contratto" style="color:var(--warn)">▲</span>`;
  const fasciaTag = p.reparto === "primavera" && p.fascia
    ? `<span class="pill" style="background:#2A2036;color:#C89BE8">${p.fascia}</span>` : "";
  const frTag = p.reparto === "fuori_rosa" ? `<span class="pill" style="background:#20303C;color:#8FC4E0">fuori rosa</span>` : "";
  return `<div class="row ${stato||""}" data-pl="${p.id}">
    <span class="rl" style="color:var(--${p.ruolo||"C"})">${p.ruolo||"·"}</span>
    <span class="nm"><b>${esc(p.nome)}</b> <span>${esc(p.club||"svincolato")}</span> ${fasciaTag}${frTag}</span>
    <span class="pz">${p.prezzo != null ? p.prezzo+" cr" : "—"}</span>
    ${clock(p)}
    <span class="fl">${flag}</span></div>`;
}

function blockRows(titolo, players, atteso){
  const over = atteso != null && players.length > atteso;
  const vuoti = atteso != null ? Math.max(0, atteso - players.length) : 0;
  const eccesso = over ? players.length - atteso : 0;
  // i giocatori oltre il limite del reparto vanno segnalati, non nascosti
  const righe = players.map((p,i) =>
    rowPlayer(p, atteso != null && i >= atteso ? "eccedenza" : "")).join("");
  const mancanti = Array.from({length:vuoti}, () => `<div class="row empty manca">
      <span class="rl">!</span><span>Manca un giocatore in questo reparto</span>
      <span></span><span></span><span></span></div>`).join("");
  return `<div class="block">
    <div class="bhead ${over?"over":""} ${vuoti?"short":""}"><span class="t">${titolo}</span>
      <span class="c">${players.length}${atteso!=null?" / "+atteso:""}</span></div>
    ${righe || (atteso==null?`<div class="row empty"><span></span><span>Nessun giocatore</span><span></span><span></span><span></span></div>`:"")}
    ${mancanti}
    ${eccesso ? `<div class="notaflag over">${eccesso} ${eccesso===1?"giocatore":"giocatori"} oltre il limite: servono uno svincolo o uno scambio.</div>` : ""}
    ${vuoti ? `<div class="notaflag short">${vuoti} ${vuoti===1?"posto libero":"posti liberi"} da riempire all'asta.</div>` : ""}
  </div>`;
}

function viewRosa(){
  const sq = team();

  const left = RUOLI.map(r => blockRows(RUOLO_NOME[r], reparto(sq,r), S.regole.rosa[r])).join("");
  const right = legendaFasce(S.annoStagione)
              + blockRows("Primavera", primavera(sq), null)
              + blockRows("Fuori rosa", fuoriRosa(sq), null)
              + `<div class="card"><h3>Aggiungi giocatore</h3>
                 <div class="hint">Usalo per un acquisto all'asta, una scelta al draft o un arrivo in scambio.</div>
                 <button class="btn pri" id="btnAdd">Aggiungi alla rosa</button></div>`;
  return `<div class="thead">
      <div><h2>${esc(sq.nome)}</h2>
        <div class="pos">${sq.posizione ? sq.posizione+"º posto la scorsa stagione" : "Posizione non impostata"} · ${nRiconferme(sq)} riconferme disponibili</div></div>
      <div class="stats">
        <div class="stat"><div class="v">${sq.crediti_residui}</div><div class="l">Crediti residui</div></div>
        <div class="stat"><div class="v">${speso(sq)}</div><div class="l">Impegnati in rosa</div></div>
        <div class="stat"><div class="v" style="color:${occ>S.regole.slotPrimavera?"var(--bad)":"inherit"}">${occ}/${S.regole.slotPrimavera}</div><div class="l">Slot vivaio</div></div>
      </div></div>
    <div class="cols"><div>${left}</div><div>${right}</div></div>`;

function viewRiconferme(){
  const sq = team();
  const lim = nRiconferme(sq);
  const rosa = sq.rosa.filter(p => p.reparto === "prima")
    .sort((a,b) => (b.prezzo||0) - (a.prezzo||0));
  const scelti = rosa.filter(p => p.riconferma);
  const costo = scelti.reduce((n,p) => n + costoRiconferma(p), 0);
  const resta = S.regole.budget - costo;
  const righe = rosa.map(p => {
    const ok = riconfermabile(p);
    const a = anniResidui(p);
    const motivo = ok ? "" : (fuoriSerieA(p) ? "Fuori dalla Serie A" : (a !== null && a <= 1) ? "Contratto esaurito" : "Non disponibile");
    const uff = quotazioneUfficiale(p);
    const q = quotazione(p);
    const forzata = p.quotazione != null && p.quotazione !== uff;
    // il costo è il maggiore fra prezzo pagato e quotazione: segnalo quale dei due comanda
    const base = q != null && q > (p.prezzo || 0) ? "quotazione" : "prezzo d'acquisto";
    return `<tr>
      <td>${ok ? `<input type="checkbox" class="rc" data-pl="${p.id}" ${p.riconferma?"checked":""}>` : ""}</td>
      <td style="color:var(--${p.ruolo})">${p.ruolo}</td>
      <td>${esc(p.nome)}</td>
      <td style="color:var(--tx-faint)">${esc(p.club||"—")}</td>
      <td class="num">${p.prezzo ?? "—"}</td>
      <td class="num"><input type="number" min="0" class="qt" data-pl="${p.id}" value="${q ?? ""}" placeholder="—"
          title="${uff != null ? "Quotazione ufficiale: " + uff : "Non trovato nel listone"}"
          style="width:64px${forzata ? ";border-color:var(--warn)" : ""}"></td>
      <td class="num"><b>${ok ? costoRiconferma(p) : "—"}</b>${ok && q != null ? `<div class="owner">${base}</div>` : ""}</td>
      <td style="color:var(--tx-faint);font-size:12.5px">${motivo}</td></tr>`;
  }).join("");
  const senzaQ = rosa.filter(p => quotazioneUfficiale(p) == null).length;
  const forzate = rosa.filter(p => p.quotazione != null && p.quotazione !== quotazioneUfficiale(p)).length;
  const avviso = !S.listone.length
    ? `<div class="card" style="border-color:var(--warn)"><h3>Quotazioni non ancora caricate</h3>
       <div class="hint" style="margin:0">Senza listone il costo coincide col prezzo d'acquisto. Importa le quotazioni ufficiali dalla scheda Listone e questa colonna si compila da sola.</div></div>`
    : senzaQ
    ? `<div class="card" style="border-color:var(--warn)"><h3>${senzaQ} giocatori senza quotazione</h3>
       <div class="hint" style="margin:0">Non li trovo nel listone, di solito perché hanno lasciato la Serie A o perché il nome è scritto in modo diverso. Per quelli puoi digitare la quotazione a mano nella colonna.</div></div>`
    : "";
  return `<div class="thead"><div><h2>Riconferme</h2>
      <div class="pos">${esc(sq.nome)} · si riconferma al prezzo d'acquisto, o alla quotazione se più alta</div></div>
    <div class="stats">
      <div class="stat"><div class="v" style="color:${scelti.length>lim?"var(--bad)":"inherit"}">${scelti.length}/${lim}</div><div class="l">Riconferme scelte</div></div>
      <div class="stat"><div class="v">${costo}</div><div class="l">Costo totale</div></div>
      <div class="stat"><div class="v" style="color:${resta<0?"var(--bad)":"var(--good)"}">${resta}</div><div class="l">Resta per l'asta</div></div>
    </div></div>
    ${avviso}
    <div class="card" style="padding:0;overflow:hidden">
      <table><thead><tr><th style="width:34px"></th><th style="width:24px"></th><th>Giocatore</th><th>Club</th>
        <th class="num">Acquisto</th><th class="num">Quotazione</th><th class="num">Costo</th><th>Note</th></tr></thead>
      <tbody>${righe}</tbody></table></div>
    <div class="btnrow"><button class="btn" id="btnClearRc">Azzera selezione</button>
      ${forzate ? `<button class="btn" id="btnResetQt">Ripristina ${forzate} quotazioni dal listone</button>` : ""}</div>`;
}

function viewDraft(){
  const ordinate = [...S.squadre].filter(s => s.posizione).sort((a,b) => a.posizione - b.posizione);
  const mancanti = S.squadre.length - ordinate.length;
  const pesi = S.regole.lottery;
  const righe = S.squadre.map((s,i) => {
    const slotLiberi = Math.max(0, S.regole.slotPrimavera - occupatiVivaio(s));
    const peso = s.posizione && pesi[s.posizione] != null ? pesi[s.posizione] + "%" : (s.posizione ? "scelta fissa" : "—");
    return `<tr><td>${esc(s.nome)}</td>
      <td><select class="pos" data-team="${i}">
        <option value="">—</option>
        ${S.squadre.map((_,n) => `<option value="${n+1}" ${s.posizione===n+1?"selected":""}>${n+1}º</option>`).join("")}
      </select></td>
      <td class="num">${nRiconferme(s)}</td>
      <td class="num">${slotLiberi}</td>
      <td class="num">${peso}</td></tr>`;
  }).join("");
  return `<div class="thead"><div><h2>Draft primavera</h2>
      <div class="pos">Le prime tre classificate prendono le ultime tre scelte. Dalla quarta alla decima si estrae a sorte, con più probabilità a chi ha chiuso peggio.</div></div></div>
    ${legendaFasce(annoDraft(), "chi scegli al draft deve rientrare in una di queste fasce")}
    ${mancanti ? `<div class="card" style="border-color:var(--warn)"><h3>Classifica incompleta</h3>
      <div class="hint" style="margin:0">Mancano ${mancanti} posizioni. Assegnale dalla scheda Classifica per poter estrarre l'ordine.</div></div>` : ""}

      <table><thead><tr><th>Squadra</th><th style="width:96px">Posizione</th><th class="num">Riconferme</th><th class="num">Slot liberi</th><th class="num">Prob. 1ª scelta</th></tr></thead>
      <tbody>${righe}</tbody></table></div>
    <div class="btnrow"><button class="btn pri" id="btnLottery" ${mancanti?"disabled style='opacity:.45'":""}>${S.ultimoDraft?"Riestrai l'ordine":"Estrai ordine del draft"}</button></div>
    ${lavagnaDraft()}`;
}

// la lavagna applica gli scambi: in ogni casella sceglie chi possiede quella pick,
// non chi l'ha generata con la propria posizione in classifica
function lavagnaDraft(){
  const d = S.ultimoDraft;
  if(!d) return "";
  const anno = d.anno ?? annoDraft();
  const giri = S.regole.giriPick;
  const blocchi = [];
  for(let g = 1; g <= giri; g++){
    const celle = d.ordine.map((oid, i) => {
      const pk = pickDi(anno, g, oid);
      if(!pk) return "";
      const propr = S.squadre.find(s => s.id === pk.possessore);
      const scambiata = pk.possessore !== pk.origine;
      const liberi = propr ? Math.max(0, S.regole.slotPrimavera - occupatiVivaio(propr)) : 0;
      const azione = pk.assegnato
        ? `<span style="color:var(--good)">${esc(pk.assegnato)}</span>`
        : liberi <= 0
          ? `<span class="via">vivaio pieno</span>`
          : (sonoAdmin() || pk.possessore === io?.squadra_id)
            ? `<button data-pick="${pk.id}">Scegli</button>`
            : `<span class="via">in attesa</span>`;
      return `<div class="pcell ${pk.assegnato?"presa":""}">
        <span class="n">${g}.${i+1}</span>
        <span>${esc(propr ? propr.nome : "?")}${scambiata?`<div class="via">via ${esc(nomeSquadra(pk.origine))}</div>`:""}</span>
        <span class="via">${pk.assegnato ? "" : liberi + " slot liberi"}</span>
        <span>${azione}</span></div>`;
    }).join("");
    const fatte = d.ordine.filter(oid => pickDi(anno,g,oid)?.assegnato).length;
    blocchi.push(`<div class="giro"><header><span>${g}º giro</span><span>${fatte}/${d.ordine.length}</span></header>${celle}</div>`);
  }
  return `<div class="card" style="margin-top:16px"><h3>Ordine estratto · draft ${anno}</h3>
      <div class="hint">Estrazione del ${esc(d.quando)}. L'ordine si ripete a ogni giro, ma in ogni casella compare chi possiede quella pick dopo gli scambi.</div>
    </div>${blocchi.join("")}`;
}

    $("dInfo").innerHTML = `Fascia <b>${f}</b>: contratto di ${dur} ${dur===1?"stagione":"stagioni"}, scadenza 1/09/${anno+dur}.`;

      if(ok){ close(); toast("Scelta inviata all'amministratore"); }

    pk.assegnato = nome;

    toast(`${nome} al vivaio di ${sq.nome}, contratto fino al 2029`.replace("2029", String(anno+dur)));

    ${mostraStato ? `<select id="lstato"><option value="">Tesserati e liberi</option>
      <option value="liberi" ${lstato==="liberi"?"selected":""}>Solo svincolati</option>
      <option value="presi" ${lstato==="presi"?"selected":""}>Solo tesserati</option></select>` : ""}
  </div>`;
}

function filtra(lista, conStato){
  return lista.filter(l => {
    if(lruolo && l.ruolo !== lruolo) return false;
    if(lclub && l.club !== lclub) return false;
    if(lq && !norm(l.nome).includes(norm(lq))) return false;
    if(conStato && lstato){
      const preso = !!proprietario(l.nome);
      if(lstato === "liberi" && preso) return false;
      if(lstato === "presi" && !preso) return false;
    }
    return true;
  });
}

let trade = { a:0, b:1, pa:new Set(), pb:new Set(), ka:new Set(), kb:new Set(), ca:0, cb:0 };

function latoScambio(lettera){
  const idx = trade[lettera];            // "a" oppure "b"
  const sq = S.squadre[idx];
  const selP = trade["p"+lettera], selK = trade["k"+lettera];
  const crediti = trade["c"+lettera];
  const righe = sq.rosa.map(p => {
    const on = selP.has(p.id);
    const tag = p.reparto === "prima" ? "" : (p.reparto === "primavera" ? " · primavera" : " · fuori rosa");
    return `<div class="selrow ${on?"on":""}" data-side="${lettera}" data-pl="${p.id}">
      <span>${on ? "✓" : ""}</span><span style="color:var(--${p.ruolo||"C"})">${p.ruolo||"·"}</span>
      <span>${esc(p.nome)}<span class="owner">${tag}</span></span>
      <span class="num" style="color:var(--tx-dim)">${p.prezzo ?? "—"}</span></div>`;
  }).join("");
  const picks = picksDi(sq.id).map(pk =>
    `<button class="chip ${selK.has(pk.id)?"on":""}" data-side="${lettera}" data-pk="${pk.id}">${esc(etichettaPick(pk))}</button>`
  ).join("") || `<span class="owner">Nessuna pick disponibile</span>`;
  return `<div class="side">
    <header>
      <select class="tradeteam" data-side="${lettera}">
        ${S.squadre.map((s,i) => `<option value="${i}" ${i===idx?"selected":""}>${esc(s.nome)}</option>`).join("")}
      </select>
      <div class="meta"><span>${sq.crediti_residui} crediti</span><span>${selP.size} giocatori scelti</span><span>${selK.size} picks</span></div>
    </header>
    <div class="pickrow"><span class="owner" style="width:100%;margin-bottom:3px">Picks del draft</span>${picks}</div>
    <div class="pickrow"><label class="owner" style="width:100%;margin-bottom:3px">Crediti da cedere</label>
      <input type="number" min="0" max="${sq.crediti_residui}" class="tradecr" data-side="${lettera}" value="${crediti}" style="width:96px"></div>
    <div class="pk">${righe}</div></div>`;
}

// controlla il pareggio dei ruoli e la sostenibilità dell'operazione
function verificaScambio(){
  const A = S.squadre[trade.a], B = S.squadre[trade.b];
  const gA = A.rosa.filter(p => trade.pa.has(p.id));
  const gB = B.rosa.filter(p => trade.pb.has(p.id));
  const err = [];
  if(trade.a === trade.b) err.push("Le due squadre coincidono: scegline due diverse.");
  if(!gA.length && !gB.length && !trade.ka.size && !trade.kb.size && !trade.ca && !trade.cb)
    err.push("Lo scambio è vuoto: seleziona almeno un giocatore, una pick o dei crediti.");
  if(trade.ca > A.crediti_residui) err.push(`${A.nome} non ha ${trade.ca} crediti disponibili.`);
  if(trade.cb > B.crediti_residui) err.push(`${B.nome} non ha ${trade.cb} crediti disponibili.`);

  const saldi = {};
  if(S.regole.pareggioRuoli){
    RUOLI.forEach(r => {
      const out = gA.filter(p => p.reparto === "prima" && p.ruolo === r).length;
      const inn = gB.filter(p => p.reparto === "prima" && p.ruolo === r).length;
      saldi[r] = inn - out;
      if(inn !== out) err.push(`${RUOLO_NOME[r]}: ${A.nome} cede ${out} e riceve ${inn}. Il reparto deve restare in pari.`);
    });
  }
  // capienza del vivaio dopo lo scambio
  const vivA = occupatiVivaio(A) - gA.filter(p => p.reparto !== "prima").length + gB.filter(p => p.reparto !== "prima").length;
  const vivB = occupatiVivaio(B) - gB.filter(p => p.reparto !== "prima").length + gA.filter(p => p.reparto !== "prima").length;
  if(vivA > S.regole.slotPrimavera) err.push(`${A.nome} arriverebbe a ${vivA} nel vivaio, oltre il limite di ${S.regole.slotPrimavera}.`);
  if(vivB > S.regole.slotPrimavera) err.push(`${B.nome} arriverebbe a ${vivB} nel vivaio, oltre il limite di ${S.regole.slotPrimavera}.`);
  return { err, gA, gB, saldi, vivA, vivB };
}

function viewScambi(){
  const v = verificaScambio();
  const A = S.squadre[trade.a], B = S.squadre[trade.b];
  const valA = v.gA.reduce((n,p) => n + (p.prezzo||0), 0) + trade.ca;
  const valB = v.gB.reduce((n,p) => n + (p.prezzo||0), 0) + trade.cb;
  const storico = (S.scambi||[]).slice().reverse().slice(0,8);
  return `<div class="thead"><div><h2>Scambi</h2>
    <div class="pos">I contratti viaggiano col giocatore e restano invariati. Il pareggio dei ruoli vale sulla prima squadra.</div></div></div>
    <div class="trade">${latoScambio("a")}<div class="tradearrow">⇄</div>${latoScambio("b")}</div>
    <div class="balance">
      <div class="bal">
        <span>${esc(A.nome)} cede <b>${valA}</b> di valore</span>
        <span>${esc(B.nome)} cede <b>${valB}</b> di valore</span>
        <span>Vivaio dopo lo scambio: <b>${v.vivA}</b> e <b>${v.vivB}</b></span>
      </div>
      ${v.err.length
        ? v.err.map(e => `<div class="err">${esc(e)}</div>`).join("")
        : `<div class="okmsg">Lo scambio rispetta il regolamento.</div>`}
      <div class="btnrow">
        <button class="btn pri" id="btnTrade" ${v.err.length?"disabled style='opacity:.45'":""}>${sonoAdmin()?"Esegui lo scambio":"Proponi lo scambio"}</button>
        <button class="btn" id="btnTradeClear">Svuota</button>
      </div></div>
    ${storico.length ? `<div class="card" style="margin-top:16px"><h3>Ultimi scambi</h3>
      <div class="hint">Registro delle operazioni già eseguite.</div>
      ${storico.map(t => `<div class="alert"><span class="ic" style="color:var(--info)">⇄</span>
        <span class="tx"><b>${esc(t.a)} ⇄ ${esc(t.b)}</b><div>${esc(t.testo)} · ${esc(t.quando)}</div></span></div>`).join("")}</div>` : ""}`;
}

function eseguiScambio(){
  const v = verificaScambio();
  if(v.err.length) return;
  const A = S.squadre[trade.a], B = S.squadre[trade.b];
  // i giocatori cambiano squadra col contratto intatto
  A.rosa = A.rosa.filter(p => !trade.pa.has(p.id));
  B.rosa = B.rosa.filter(p => !trade.pb.has(p.id));
  v.gA.forEach(p => { p.riconferma = false; B.rosa.push(p); });
  v.gB.forEach(p => { p.riconferma = false; A.rosa.push(p); });
  S.picks.forEach(pk => {
    if(trade.ka.has(pk.id)) pk.possessore = B.id;
    if(trade.kb.has(pk.id)) pk.possessore = A.id;
  });
  A.crediti_residui += trade.cb - trade.ca;
  B.crediti_residui += trade.ca - trade.cb;

  const parte = (g,k,c) => [
    g.map(p => p.nome).join(", "),
    k ? `${k} pick` : "",
    c ? `${c} crediti` : ""
  ].filter(Boolean).join(" + ") || "nulla";
  S.scambi = S.scambi || [];
  S.scambi.push({ a:A.nome, b:B.nome,
    testo: `${A.nome} cede ${parte(v.gA, trade.ka.size, trade.ca)}; ${B.nome} cede ${parte(v.gB, trade.kb.size, trade.cb)}`,
    anno: S.annoStagione,
    quando: new Date().toLocaleString("it-IT",{ dateStyle:"short", timeStyle:"short" }) });
  trade.pa.clear(); trade.pb.clear(); trade.ka.clear(); trade.kb.clear(); trade.ca = 0; trade.cb = 0;
  save(); render(); toast("Scambio eseguito");
}

function leggiListone(file){

  rd.onload = e => {
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:"array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const grid = XLSX.utils.sheet_to_json(ws, { header:1, defval:null });
      // il file ufficiale ha una riga di titolo prima delle intestazioni: la cerco
      let hi = grid.findIndex(r => r && r.some(c => /^nome$/i.test(String(c||"").trim()))
                                   && r.some(c => /^squadra$/i.test(String(c||"").trim())));
      if(hi < 0) throw new Error("Non trovo le colonne Nome e Squadra");
      const head = grid[hi].map(c => String(c||"").trim().toLowerCase());
      const col = n => head.findIndex(h => n.test(h));
      const iN = col(/^nome$/), iS = col(/^squadra$/), iR = col(/^r$/),
            iQA = col(/^qt\.?a$/), iQI = col(/^qt\.?i$/), iF = col(/^fvm$/);
      const mapR = { p:"P", d:"D", c:"C", a:"A" };
      const out = [];
      for(let i = hi+1; i < grid.length; i++){
        const r = grid[i]; if(!r || !r[iN]) continue;
        const ruolo = mapR[String(r[iR]||"").trim().toLowerCase()];
        if(!ruolo) continue;
        out.push({ nome:String(r[iN]).trim(), club:String(r[iS]||"").trim(), ruolo,
                   qa: num(r[iQA]), qi: num(r[iQI]), fvm: num(r[iF]) });
      }
      if(!out.length) throw new Error("Nessun calciatore riconosciuto");
      const precedente = S.listone.length;
      S.listone = out;
      const titolo = String((grid[0]||[]).filter(Boolean)[0] || "").trim();
      S.listoneInfo = `${out.length} calciatori${titolo ? " · " + titolo : ""} · importato il ${new Date().toLocaleDateString("it-IT")}`;
      save(); render();
      toast(precedente ? `Listone sostituito: ${out.length} calciatori` : `Listone importato: ${out.length} calciatori`);
      setTimeout(proponiAllineamento, 400);
    }catch(err){
      toast("Il file non ha il formato delle quotazioni ufficiali: " + err.message);
    }
  };
  rd.readAsArrayBuffer(file);
}
function num(v){ const n = parseFloat(String(v).replace(",",".")); return isNaN(n) ? null : n; }

/* ================= STAGIONI ================= */
// con l'anno di nascita la fascia è esatta; senza, si scala di uno a ogni stagione
function fasciaEsatta(p, anno){
  if(!p.nato) return null;
  const e = anno - p.nato;
  if(e >= 23) return "U23";
  if(e === 22) return "U22";
  if(e === 21) return "U21";
  return "U20";
}
function fasciaAvanzata(p, nuovoAnno){
  const esatta = fasciaEsatta(p, nuovoAnno);
  if(esatta) return esatta;
  return ({ U20:"U21", U21:"U22", U22:"U23", U23:"U23" })[p.fascia] || p.fascia;
}

function archivia(){
  S.archivio = S.archivio || [];
  const copia = JSON.parse(JSON.stringify({
    annoStagione: S.annoStagione, squadre: S.squadre, picks: S.picks, scambi: S.scambi
  }));
  S.archivio.push(copia);
}

function avanzaStagione(){
  archivia();
  const nuovo = S.annoStagione + 1;
  const report = { scaduti:[], oltreFascia:[], promossi:0 };
  S.squadre.forEach(sq => {
    // i contratti giunti a termine liberano il giocatore
    const finiti = sq.rosa.filter(p => { const a = +String(p.scadenza||"").slice(0,4) - nuovo; return p.scadenza && a <= 0; });
    finiti.forEach(p => report.scaduti.push(`${p.nome} (${sq.nome})`));
    sq.rosa = sq.rosa.filter(p => !finiti.includes(p));
    // le fasce del vivaio salgono di un anno
    sq.rosa.forEach(p => {
      if(p.reparto === "primavera"){
        const prima = p.fascia;
        p.fascia = fasciaAvanzata(p, nuovo);
        if(prima === "U23" && p.fascia === "U23") report.oltreFascia.push(`${p.nome} (${sq.nome})`);
      }
      p.riconferma = false;
    });
    sq.crediti_residui = S.regole.budget;   // la dotazione si azzera e riparte
  });
  S.annoStagione = nuovo;
  // una nuova annata di picks entra in circolazione
  const ultimo = nuovo + S.regole.stagioniPick;
  S.squadre.forEach(s => {
    for(let g = 1; g <= S.regole.giriPick; g++)
      S.picks.push({ id:uid(), anno:ultimo, giro:g, origine:s.id, possessore:s.id });
  });
  S.picks = S.picks.filter(p => p.anno > nuovo - 1);
  save(); render();
  const pezzi = [`Stagione ${nuovo}/${String(nuovo+1).slice(2)}`];
  if(report.scaduti.length) pezzi.push(`${report.scaduti.length} contratti conclusi`);
  pezzi.push(`crediti riportati a ${S.regole.budget}`);
  toast(pezzi.join(" · "));
  if(report.scaduti.length) mostraReport(nuovo, report);
}

/* ---- allineamento delle rose al listone importato ---- */
function confrontaConListone(){
  const cambi = [], usciti = [], ruoli = [];
  S.squadre.forEach(sq => sq.rosa.forEach(p => {
    const l = S.listone.find(x => stessoGiocatore(x.nome, p.nome));
    if(!l){ if(p.club) usciti.push({ p, sq }); return; }
    if(norm(l.club) !== norm(p.club || "")) cambi.push({ p, sq, da:p.club || "—", a:l.club });
    // un cambio di ruolo sposta il giocatore di reparto e puo sbilanciare la rosa
    if(l.ruolo && p.ruolo && l.ruolo !== p.ruolo) ruoli.push({ p, sq, da:p.ruolo, a:l.ruolo });
  }));
  return { cambi, usciti, ruoli };
}

function applicaListone(d){
  d.cambi.forEach(c => c.p.club = c.a);
  d.ruoli.forEach(r => r.p.ruolo = r.a);
  d.usciti.forEach(u => u.p.club = "");   // vuoto significa fuori dalla Serie A
  save(); render();
  const pezzi = [];
  if(d.cambi.length) pezzi.push(`${d.cambi.length} club aggiornati`);
  if(d.ruoli.length) pezzi.push(`${d.ruoli.length} cambi di ruolo`);
  if(d.usciti.length) pezzi.push(`${d.usciti.length} fuori dalla Serie A`);
  toast(pezzi.join(", ") || "Nessuna modifica");
}

function mostraAccesso(errore){
  // dentro un'anteprima in sandbox le risposte di rete non riescono a tornare:
  // meglio dirlo in chiaro che mostrare l'errore tecnico
  const sandbox = errore && /clone|DataCloneError|postMessage/i.test(errore);
  const testo = sandbox
    ? "Questa anteprima non può collegarsi al database. Apri l'app dal suo indirizzo pubblicato e funzionerà."
    : errore;
  document.getElementById("modalHost").innerHTML = `<div class="gate"><div class="gatebox">
    <h1>Fantamanager</h1>
    <p>Inserisci il codice che ti ha dato l'amministratore della lega.</p>
    <input id="gCod" placeholder="codice di accesso" autocomplete="off" spellcheck="false">
    <button class="btn pri" id="gVai">Entra</button>
    <div class="msg" id="gMsg" style="color:var(--${sandbox?"warn":"bad"})">${testo ? esc(testo) : ""}</div>
  </div></div>`;
  const inp = document.getElementById("gCod");
  const vai = async () => {
    const v = inp.value.trim();
    if(!v){ document.getElementById("gMsg").textContent = "Serve il codice"; return; }
    document.getElementById("gMsg").style.color = "var(--tx-faint)";
    document.getElementById("gMsg").textContent = "Verifico…";
    try{ await entra(v); document.getElementById("modalHost").innerHTML = ""; await avvia(); }
    catch(err){ mostraAccesso(err.message || "Codice non riconosciuto"); }
  };
  document.getElementById("gVai").onclick = vai;
  inp.onkeydown = e => { if(e.key === "Enter") vai(); };
  inp.focus();
}

function descriviAzione(a){
  const sq = S.squadre.find(s => s.id === a.squadra_id);
  const c = a.contenuto || {};
  if(a.tipo === "draft"){
    const pk = S.picks.find(p => p.id === c.pickId);
    return `${esc(sq?.nome || a.squadra_id)} sceglie <b>${esc(c.nome || "?")}</b>${pk ? ` con la ${pk.giro}º del ${pk.anno}` : ""}`;
  }
  const altra = S.squadre.find(s => s.id === c.controparte);
  const lato = (ids, cr, pk) => {
    const nomi = (ids || []).map(id => (S.squadre.flatMap(s => s.rosa).find(p => p.id === id) || {}).nome).filter(Boolean);
    return [nomi.join(", "), (pk||[]).length ? `${pk.length} pick` : "", cr ? `${cr} crediti` : ""].filter(Boolean).join(" + ") || "nulla";
  };
  return `<b>${esc(sq?.nome || a.squadra_id)}</b> cede ${esc(lato(c.miei, c.mieiCrediti, c.miePick))}, `
       + `<b>${esc(altra?.nome || "?")}</b> cede ${esc(lato(c.suoi, c.suoiCrediti, c.suePick))}`;
}

async function decidi(id, esito, motivo){
  const { error } = await db.rpc("decidi_azione",
    { p_codice: codice, p_id: id, p_esito: esito, p_motivo: motivo || null });
  if(error){ toast("Non riuscito: " + error.message); return false; }
  await caricaAzioni();
  return true;
}

async function applicaAzione(id){
  const a = azioni.find(x => x.id === id);
  if(!a) return;
  if(a.tipo === "draft"){
    const c = a.contenuto, pk = S.picks.find(p => p.id === c.pickId);
    if(!pk || pk.assegnato){ toast("Quella pick non è più disponibile"); await decidi(id,"rifiutata","pick non disponibile"); render(); return; }
    const sq = S.squadre.find(s => s.id === pk.possessore);
    if(occupatiVivaio(sq) >= S.regole.slotPrimavera){ toast("Vivaio pieno"); await decidi(id,"rifiutata","vivaio pieno"); render(); return; }
    const dur = S.regole.durataPrimavera[c.fascia] ?? 3;
    sq.rosa.push({ id:uid(), nome:c.nome, ruolo:c.ruolo, club:c.club, prezzo:0,
      nato:c.nato ?? null, scadenza:`${pk.anno+dur}-09-01`, reparto:"primavera", fascia:c.fascia });
    pk.assegnato = c.nome;
  } else {
    const c = a.contenuto;
    const ia = S.squadre.findIndex(s => s.id === a.squadra_id);
    const ib = S.squadre.findIndex(s => s.id === c.controparte);
    if(ia < 0 || ib < 0){ toast("Squadre non trovate"); return; }
    trade = { a:ia, b:ib, pa:new Set(c.miei||[]), pb:new Set(c.suoi||[]),
              ka:new Set(c.miePick||[]), kb:new Set(c.suePick||[]),
              ca:c.mieiCrediti||0, cb:c.suoiCrediti||0 };
    const v = verificaScambio();
    if(v.err.length){
      toast("Non più valido: " + v.err[0]);
      await decidi(id, "rifiutata", v.err[0]); render(); return;
    }
    eseguiScambio();
  }
  await decidi(id, "accettata");
  save(); render(); toast("Richiesta applicata");
}

/* ================= PROPOSTE (manager) ================= */
async function inviaAzione(tipo, contenuto){
  if(!collegato){ toast("Non sei collegato al database"); return false; }
  const { error } = await db.rpc("invia_azione",
    { p_codice: codice, p_tipo: tipo, p_contenuto: contenuto });
  if(error){ toast("Invio non riuscito: " + error.message); return false; }
  return true;
}

async function proponiScambio(){
  const v = verificaScambio();
  if(v.err.length){ toast(v.err[0]); return; }
  const A = S.squadre[trade.a], B = S.squadre[trade.b];
  if(A.id !== io.squadra_id && B.id !== io.squadra_id){
    toast("Puoi proporre solo scambi che coinvolgono la tua squadra"); return;
  }
  const io_e_A = A.id === io.squadra_id;
  const ok = await inviaAzione("scambio", {
    controparte: io_e_A ? B.id : A.id,
    miei:  [...(io_e_A ? trade.pa : trade.pb)],
    suoi:  [...(io_e_A ? trade.pb : trade.pa)],
    miePick: [...(io_e_A ? trade.ka : trade.kb)],
    suePick: [...(io_e_A ? trade.kb : trade.ka)],
    mieiCrediti: io_e_A ? trade.ca : trade.cb,
    suoiCrediti: io_e_A ? trade.cb : trade.ca
  });
  if(ok){
    trade.pa.clear(); trade.pb.clear(); trade.ka.clear(); trade.kb.clear();
    trade.ca = 0; trade.cb = 0;
    render(); toast("Proposta inviata all'amministratore");
  }
}

      ${pb.map(p => `<div class="alert"><span class="ic" style="color:var(--${p.lv==="bad"?"bad":p.lv==="warn"?"warn":"info"})">${p.lv==="bad"?"▲":p.lv==="warn"?"▲":"•"}</span>
        <span class="tx"><b>${esc(p.t)}</b><div>${esc(p.d)}</div></span></div>`).join("")}</div>`;
  }).join("");
  return `<div class="thead"><div><h2>Controlli</h2>
    <div class="pos">Ogni squadra viene confrontata con il regolamento a ogni modifica.</div></div></div>
    ${blocchi || `<div class="card"><div class="ok-empty">Nessuna anomalia. Tutte le rose rispettano limiti di reparto, slot vivaio e scadenze.</div></div>`}`;
}

function bindView(){
  document.querySelectorAll("[data-team]").forEach(el => {
    if(el.classList.contains("tbtn")) el.onclick = () => { sel = +el.dataset.team; render(); };
  });
  document.querySelectorAll(".row[data-pl]").forEach(el => el.onclick = () => openPlayer(el.dataset.pl));
  const add = document.getElementById("btnAdd");
  if(add) add.onclick = () => openPlayer(null);

  document.querySelectorAll(".rc").forEach(cb => cb.onchange = () => {
    const p = findPlayer(cb.dataset.pl);
    p.riconferma = cb.checked; save(); render();
  });
  document.querySelectorAll(".qt").forEach(inp => inp.onchange = () => {
    const p = findPlayer(inp.dataset.pl);
    const v = inp.value === "" ? null : +inp.value;
    // se coincide con la quotazione ufficiale non è una forzatura: torno a seguire il listone
    p.quotazione = (v === null || v === quotazioneUfficiale(p)) ? null : v;
    save(); render();
  });
  const rq = document.getElementById("btnResetQt");
  if(rq) rq.onclick = () => {
    team().rosa.forEach(p => p.quotazione = null); save(); render();
    toast("Quotazioni riallineate al listone");
  };
  const clr = document.getElementById("btnClearRc");
  if(clr) clr.onclick = () => { team().rosa.forEach(p => p.riconferma = false); save(); render(); };

  document.querySelectorAll("select.pos").forEach(s => s.onchange = () => {
    const i = +s.dataset.team, v = s.value ? +s.value : null;
    if(v) S.squadre.forEach((t,n) => { if(n !== i && t.posizione === v) t.posizione = null; });
    S.squadre[i].posizione = v; save(); render();
  });
  const lot = document.getElementById("btnLottery");
  if(lot) lot.onclick = estraiDraft;
  document.querySelectorAll("button[data-pick]").forEach(b =>
    b.onclick = () => apriScelta(b.dataset.pick));

  document.querySelectorAll("input.rule").forEach(inp => inp.onchange = () => {
    set(S, inp.dataset.path, +inp.value); save(); render();
  });

  /* --- classifica --- */
  document.querySelectorAll("input.punti").forEach(inp => inp.onchange = () => {
    S.squadre[+inp.dataset.team].punti = inp.value === "" ? null : +inp.value; save(); render();
  });
  const dp = document.getElementById("btnDaPunti");
  if(dp) dp.onclick = () => {
    const conPunti = S.squadre.filter(s => s.punti != null);
    if(conPunti.length < 2){ toast("Servono i punti di almeno due squadre"); return; }
    [...conPunti].sort((a,b) => b.punti - a.punti).forEach((s,i) => s.posizione = i+1);
    S.squadre.filter(s => s.punti == null).forEach(s => s.posizione = null);

  };
  const az = document.getElementById("btnAzzeraCl");
  if(az) az.onclick = () => conferma("Azzerare la classifica?",
    "Posizioni e punti tornano vuoti. Riconferme e ordine del draft resteranno da ricalcolare.",
    () => { S.squadre.forEach(s => { s.posizione = null; s.punti = null; });
            document.getElementById("modalHost").innerHTML = ""; save(); render(); toast("Classifica azzerata"); });

  /* --- storico --- */
  const st = document.getElementById("stSq");
  if(st) st.onchange = () => { stFiltro = st.value; render(); };

  const tp = document.getElementById("togglePareggio");
  if(tp) tp.onchange = () => { S.regole.pareggioRuoli = tp.value === "1"; save(); render(); };
  const rp = document.getElementById("btnRigeneraPicks");
  if(rp) rp.onclick = () => conferma("Rigenerare le picks?",
    "Ogni squadra torna proprietaria delle proprie picks e gli scambi di picks già registrati vengono annullati.",
    () => { S.picks = generaPicks(S); document.getElementById("modalHost").innerHTML = "";
            save(); render(); toast("Picks rigenerate"); });

  /* --- listone: filtri e importazione --- */
  const q = document.getElementById("lq");
  if(q) q.oninput = deb(() => { lq = q.value; const at = document.activeElement === q; render();
    if(at){ const n = document.getElementById("lq"); if(n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); } } }, 220);
  [["lruolo", v => lruolo = v], ["lclub", v => lclub = v], ["lstato", v => lstato = v]].forEach(([id,fn]) => {
    const el = document.getElementById(id);
    if(el) el.onchange = () => { fn(el.value); render(); };
  });
  const fi = document.getElementById("listFile");
  const pf = document.getElementById("btnPickFile");
  if(pf) pf.onclick = () => fi.click();
  if(fi) fi.onchange = e => { if(e.target.files[0]) leggiListone(e.target.files[0]); };
  const dz = document.getElementById("drop");
  if(dz){
    dz.ondragover = e => { e.preventDefault(); dz.classList.add("hot"); };
    dz.ondragleave = () => dz.classList.remove("hot");
    dz.ondrop = e => { e.preventDefault(); dz.classList.remove("hot");
      if(e.dataTransfer.files[0]) leggiListone(e.dataTransfer.files[0]); };
  }
  const rl = document.getElementById("btnRicarica");
  if(rl) rl.onclick = () => conferma("Svuotare il listone?",
    "Le rose non vengono toccate, ma finche non ne carichi un altro le quotazioni spariscono e le riconferme tornano a costare il prezzo d'acquisto.",
    () => { S.listone = []; S.listoneInfo = null;
            document.getElementById("modalHost").innerHTML = "";
            save(); render(); toast("Listone svuotato"); });
  const rt = document.getElementById("btnResetTutte");
  if(rt) rt.onclick = () => conferma("Azzerare le quotazioni forzate?",
    "Ogni valore scritto a mano viene rimosso e tutte le squadre tornano a seguire il listone.",
    () => { S.squadre.forEach(sq => sq.rosa.forEach(p => p.quotazione = null));
            document.getElementById("modalHost").innerHTML = "";
            save(); render(); toast("Quotazioni riallineate al listone"); });

  /* --- scambi --- */

    render();
  });
  document.querySelectorAll(".selrow[data-pl]").forEach(el => el.onclick = () => {
    const set_ = trade["p" + el.dataset.side], id = el.dataset.pl;
    set_.has(id) ? set_.delete(id) : set_.add(id);
    render();
  });
  document.querySelectorAll(".chip[data-pk]").forEach(el => el.onclick = () => {
    const set_ = trade["k" + el.dataset.side], id = el.dataset.pk;
    set_.has(id) ? set_.delete(id) : set_.add(id);
    render();
  });
  document.querySelectorAll(".tradecr").forEach(el => el.onchange = () => {
    trade["c" + el.dataset.side] = Math.max(0, +el.value || 0); render();
  });
  const bt = document.getElementById("btnTrade");
  if(bt) bt.onclick = () => sonoAdmin() ? eseguiScambio() : proponiScambio();
  document.querySelectorAll("[data-ok]").forEach(b =>
    b.onclick = () => applicaAzione(+b.dataset.ok));
  document.querySelectorAll("[data-no]").forEach(b =>

  const bc = document.getElementById("btnTradeClear");
  if(bc) bc.onclick = () => {
    trade.pa.clear(); trade.pb.clear(); trade.ka.clear(); trade.kb.clear();
    trade.ca = 0; trade.cb = 0; render();
  };
}
function deb(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

function findPlayer(id){
  for(const s of S.squadre){ const p = s.rosa.find(x => x.id === id); if(p) return p; }
  return null;
}

        <div class="f"><label>Prezzo d'acquisto</label><input type="number" id="mPrezzo" min="0" value="${p.prezzo ?? 0}"></div>
        <div class="f"><label>Quotazione attuale</label><input type="number" id="mQuot" min="0" value="${p.quotazione ?? ""}" placeholder="${quotazioneUfficiale(p) ?? "—"}"></div>

        ${p.reparto === "prima" ? `<button class="btn" id="mRetrocedi">Manda in primavera come fuori rosa</button>` : ""}
      </div>` : ""}
    </div>

      ${!isNew ? `<button class="btn dgr" id="mSvincola">Svincola</button>` : ""}

    p.fascia = p.reparto === "primavera"

  if(sv) sv.onclick = () => {

  };
  const rt = document.getElementById("mRetrocedi");
  if(rt) rt.onclick = () => {

    save(); close(); render();

  };
}

/* ---- lottery ---- */
function estraiDraft(){
  const pesi = S.regole.lottery;
  let pool = S.squadre.filter(s => s.posizione >= 4).map(s => ({ s, w: +pesi[s.posizione] || 0 }));
  const ordine = [];
  while(pool.length){
    const tot = pool.reduce((n,x) => n + x.w, 0);
    let r = Math.random() * (tot || pool.length), k = 0;
    for(; k < pool.length; k++){ r -= (tot ? pool[k].w : 1); if(r <= 0) break; }
    k = Math.min(k, pool.length - 1);
    ordine.push(pool[k].s.id);
    pool.splice(k,1);
  }
  [3,2,1].forEach(pos => {
    const s = S.squadre.find(x => x.posizione === pos);
    if(s) ordine.push(s.id);
  });
  S.ultimoDraft = { anno: annoDraft(), ordine,
    quando: new Date().toLocaleString("it-IT",{dateStyle:"short",timeStyle:"short"}) };
  save(); render(); toast("Ordine del draft estratto");
}

/* ---- utility ---- */
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function get(o,p){ return p.split(".").reduce((a,k) => a?.[k], o); }
function set(o,p,v){ const k = p.split("."); const l = k.pop(); k.reduce((a,x) => a[x], o)[l] = v; }
function toast(m){
  const h = document.getElementById("toastHost");
  h.innerHTML = `<div class="toast">${esc(m)}</div>`;
  setTimeout(() => h.innerHTML = "", 2600);
}
function conferma(titolo, testo, ok){
  const host = document.getElementById("modalHost");
  const prev = host.innerHTML;
  host.innerHTML = `<div class="scrim"><div class="modal" style="width:min(400px,100%)">
    <div class="mhead"><h3>${esc(titolo)}</h3></div>
    <div class="mbody"><div class="hint" style="margin:0">${esc(testo)}</div></div>
    <div class="mfoot"><button class="btn" id="cNo">Annulla</button><button class="btn dgr" id="cSi">Conferma</button></div></div></div>`;
  document.getElementById("cNo").onclick = () => host.innerHTML = prev;
  document.getElementById("cSi").onclick = ok;
}

  const a = S.annoStagione + 1;
  conferma(`Passare alla stagione ${a}/${String(a+1).slice(2)}?`,
    `I contratti giunti a termine liberano i giocatori, le fasce del vivaio salgono di un anno e i crediti tornano a ${S.regole.budget} per tutti. La stagione attuale viene archiviata, così puoi tornare indietro.`,
    () => { document.getElementById("modalHost").innerHTML = ""; avanzaStagione(); });
};
document.getElementById("btnPrev").onclick = () => { if(S.archivio && S.archivio.length) tornaIndietro(); };

document.querySelectorAll(".tab").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
function esportaDati(){
  const b = new Blob([JSON.stringify(S,null,1)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = `fantamanager_${S.annoStagione}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast("Dati esportati");
}
document.getElementById("btnExport").onclick = esportaDati;
document.getElementById("btnImport").onclick = () => document.getElementById("fileIn").click();
document.getElementById("fileIn").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const d = JSON.parse(rd.result);
      if(!d.squadre) throw 0;
      S = d; sel = 0; save(); render(); toast("Dati importati");
    }catch(err){ toast("Il file non contiene dati di lega validi"); }
  };
  rd.readAsText(f);
};
document.getElementById("btnReset").onclick = () => {
  conferma("Ripristinare i dati iniziali?", "Torni alle rose dell'export ufficiale del 21 luglio 2026, con il vivaio ripreso dal foglio contratti di gennaio. Tutte le modifiche fatte qui vanno perse: esportale prima se ti servono.", () => {
    S = freshState(); sel = 0; document.getElementById("modalHost").innerHTML = "";
    save(); render(); toast("Dati iniziali ripristinati");
  });
};

/* ---- avvio ---- */
async function avvia(){
  S = await load();
  try{
    const remoto = await scaricaStato();
    if(remoto){ S = remoto; collegato = true; }
    else if(sonoAdmin()){
      collegato = true;
      await inviaStato();                 // prima accensione: pubblico le rose locali
      toast("Rose pubblicate sul database");
    } else {
      toast("L'amministratore non ha ancora pubblicato la lega");
    }
  }catch(e){ toast("Collegamento non riuscito: " + (e.message||e)); }
  if(collegato){ await caricaAzioni(); ascolta(); }
  if(!sonoAdmin()) tab = "rosa";
  render();
  if(sonoAdmin() && datiVecchi()) proponiAggiornamento();
}

(async () => {
  apriDb();
  let salvato = null;
  try{ const r = await window.storage.get(CODICE_KEY); salvato = r && r.value; }catch(e){}
  if(salvato){
    try{ await entra(salvato); await avvia(); return; }catch(e){}
  }
  S = await load(); render();
  mostraAccesso();
})();
</script>
